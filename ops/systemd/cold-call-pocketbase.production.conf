[Service]
User=cold-call-trainer
Group=cold-call-trainer
EnvironmentFile=/etc/cold-call-trainer.provisioning.env
ExecStart=
ExecStart=/opt/cold-call-trainer/bin/pocketbase serve --http 127.0.0.1:8090 --dir /var/lib/cold-call-trainer/pb_data --hooksDir /opt/cold-call-trainer/pb_hooks
ProtectSystem=strict
ProtectHome=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
ReadWritePaths=/var/lib/cold-call-trainer/pb_data
